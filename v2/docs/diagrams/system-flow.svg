<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Helvetica Neue, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#4B5563"/></marker>
    <style>
      .box{fill:#fff;stroke:#D1D5DB;stroke-width:1.5}
      .data{fill:#FFF7E6;stroke:#E0A421}
      .core{fill:#EEF2FF;stroke:#2F4BFF}
      .ui{fill:#ECFDF3;stroke:#23A55A}
      .ext{fill:#FDECEA;stroke:#DC4B3B}
      .t{fill:#111827;font-weight:700}
      .s{fill:#4B5563;font-size:12.5px}
      .l{stroke:#4B5563;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .lane{fill:none;stroke:#E5E7EB;stroke-dasharray:6 6}
      .lt{fill:#9CA3AF;font-size:11px;font-weight:700;letter-spacing:.08em}
    </style>
  </defs>
  <text x="40" y="44" font-size="22" class="t">System flow</text>
  <text x="40" y="66" class="s">Modular data feeds one core; the core serves both the page and the API; buy clicks close the loop back into the traction HUD.</text>

  <!-- lanes -->
  <rect x="40" y="100" width="260" height="500" class="lane" rx="16"/><text x="56" y="124" class="lt">DATA  /data/*.json</text>
  <rect x="330" y="100" width="260" height="500" class="lane" rx="16"/><text x="346" y="124" class="lt">CORE  packages/core</text>
  <rect x="620" y="100" width="260" height="500" class="lane" rx="16"/><text x="636" y="124" class="lt">SURFACES</text>
  <rect x="910" y="100" width="250" height="500" class="lane" rx="16"/><text x="926" y="124" class="lt">OUTSIDE</text>

  <!-- data modules -->
  <g>
    <rect x="60" y="150" width="220" height="44" class="box data" rx="10"/><text x="76" y="177" class="t">assets.json</text>
    <rect x="60" y="204" width="220" height="44" class="box data" rx="10"/><text x="76" y="231" class="t">categories.json</text>
    <rect x="60" y="258" width="220" height="44" class="box data" rx="10"/><text x="76" y="285" class="t">aliases.json</text>
    <rect x="60" y="312" width="220" height="44" class="box data" rx="10"/><text x="76" y="339" class="t">entities.json</text>
    <rect x="60" y="366" width="220" height="44" class="box data" rx="10"/><text x="76" y="393" class="t">countries.json</text>
    <rect x="60" y="420" width="220" height="44" class="box data" rx="10"/><text x="76" y="447" class="t">venues.json</text>
    <rect x="60" y="500" width="220" height="60" class="box data" rx="10"/><text x="76" y="524" class="t">activity (live)</text><text x="76" y="544" class="s">from the order log, not a file</text>
  </g>

  <!-- core -->
  <rect x="350" y="150" width="220" height="118" class="box core" rx="12"/>
  <text x="366" y="176" class="t">resolve(q)</text>
  <text x="366" y="198" class="s">entity → alias → category → asset</text>
  <text x="366" y="216" class="s">returns assets + trail</text>
  <text x="366" y="240" class="s">reads: assets, categories, aliases,</text><text x="366" y="254" class="s">entities</text>

  <rect x="350" y="290" width="220" height="90" class="box core" rx="12"/>
  <text x="366" y="316" class="t">matrix(q, who)</text>
  <text x="366" y="338" class="s">status per country per asset</text>
  <text x="366" y="356" class="s">reads: countries.rules[who]</text>

  <rect x="350" y="410" width="220" height="70" class="box core" rx="12"/>
  <text x="366" y="436" class="t">venues(asset, country)</text>
  <text x="366" y="458" class="s">local override → default, + ref tag</text>

  <path d="M280 172 H350" class="l"/><path d="M280 226 H320 V190 H350" class="l"/><path d="M280 280 H320 V200 H350" class="l"/><path d="M280 334 H320 V210 H350" class="l"/>
  <path d="M280 388 H320 V335 H350" class="l"/>
  <path d="M280 442 H350" class="l"/>
  <path d="M460 260 V290" class="l"/><path d="M460 380 V410" class="l"/>

  <!-- surfaces -->
  <rect x="640" y="150" width="220" height="140" class="box ui" rx="12"/>
  <text x="656" y="176" class="t">Web app  /app/index.html</text>
  <text x="656" y="198" class="s">hero search + HUD</text>
  <text x="656" y="216" class="s">citizen / foreigner toggle</text>
  <text x="656" y="234" class="s">status / asset tabs</text>
  <text x="656" y="252" class="s">20-tile grid per country</text>
  <text x="656" y="270" class="s">buy column</text>

  <rect x="640" y="320" width="220" height="110" class="box ui" rx="12"/>
  <text x="656" y="346" class="t">HTTP API  /v1</text>
  <text x="656" y="368" class="s">/resolve  /matrix  /rules</text>
  <text x="656" y="386" class="s">/venues  /activity</text>
  <text x="656" y="404" class="s">POST /orders/click</text>

  <rect x="640" y="460" width="220" height="70" class="box ui" rx="12"/>
  <text x="656" y="486" class="t">Your existing product</text>
  <text x="656" y="508" class="s">embeds the matrix or calls the API</text>

  <path d="M570 205 H640" class="l"/><path d="M570 335 H640 " class="l"/><path d="M570 445 H600 V375 H640" class="l"/>
  <path d="M750 430 V460" class="l"/>

  <!-- outside -->
  <rect x="930" y="150" width="210" height="90" class="box ext" rx="12"/>
  <text x="946" y="176" class="t">Venues</text>
  <text x="946" y="198" class="s">brokers, exchanges, listings</text>
  <text x="946" y="216" class="s">link carries ref= tag</text>

  <rect x="930" y="290" width="210" height="90" class="box ext" rx="12"/>
  <text x="946" y="316" class="t">Attribution ledger</text>
  <text x="946" y="338" class="s">clicks → referrals → PFOF</text>
  <text x="946" y="356" class="s">per venue, per country</text>

  <rect x="930" y="440" width="210" height="90" class="box ext" rx="12"/>
  <text x="946" y="466" class="t">Securities master</text>
  <text x="946" y="488" class="s">later replaces entities.json</text>
  <text x="946" y="506" class="s">ISIN / ticker → home country</text>

  <path d="M860 200 H930" class="l"/>
  <path d="M860 375 H895 V335 H930" class="l"/>
  <path d="M1035 380 V410 H890 V530 H280" class="l"/>
  <text x="560" y="548" class="s">click events flow back into the HUD numbers</text>

  <text x="40" y="626" class="s">Colour: amber = data you own and edit · blue = logic (no UI) · green = things people or programs touch · red = third parties.</text>
</svg>
